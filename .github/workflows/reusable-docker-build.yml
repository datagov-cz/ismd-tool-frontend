name: Reusable Docker Build Workflow

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch name (main or dev)'
        required: true
        type: string
      version:
        description: 'Version to use (from Git tag), leave empty to auto-detect'
        required: false
        type: string
        default: ''

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history to get tags

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Get version
        # Inputs reach the script through env, never as ${{ }} inside run:.
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$INPUT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::branch input has characters outside [A-Za-z0-9._/-]"
            exit 1
          fi

          # If version provided via input, use it
          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
              echo "::error::version input has characters outside [0-9A-Za-z._-]"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
            echo "Using provided version: $VERSION"
          else
            # Get base version from latest Git tag (only tags matching v[0-9]*)
            TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              BASE_VERSION="0.1.0"
              echo "No tags found, using default version: $BASE_VERSION"
            else
              BASE_VERSION=$(echo "$TAG" | sed 's/^v//')
              echo "Found tag: $TAG, using version: $BASE_VERSION"
            fi
            
            if [ "$INPUT_BRANCH" = "main" ]; then
              # For main, use tag version as-is
              VERSION="$BASE_VERSION"
              echo "Using version from Git tag: $VERSION"
            else
              # For dev, use tag version + SHA (tracks latest release)
              VERSION="${BASE_VERSION}-$(git rev-parse --short HEAD)"
              echo "Using dev version: $VERSION (based on latest tag $BASE_VERSION)"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Final version: $VERSION"
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_TAG
        env:
          REPOSITORY: ${{ github.repository }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$INPUT_BRANCH" = "main" ]; then
            REPO_PATH="$REPOSITORY"
          else
            # For dev, VERSION already includes SHA (e.g., 0.1.0-abc1234)
            REPO_PATH="${REPOSITORY}-${INPUT_BRANCH}"
          fi
          # Image names must be lowercase
          REPO_PATH=$(echo "$REPO_PATH" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/${REPO_PATH}:${VERSION}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=ghcr.io/${REPO_PATH}:latest" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build and push Docker image
        run: |
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"
